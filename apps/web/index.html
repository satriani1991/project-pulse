    <script>try{var q=new URLSearchParams(location.search).get('ws'),w=q||sessionStorage.getItem('pulse-workspace')||localStorage.getItem('pulse-workspace')||'default',t=localStorage.getItem('pulse-theme:'+w)||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
