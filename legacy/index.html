<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Project Pulse</title><style> *{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:15px system-ui}header{padding:22px 5%;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:20px}header b{font-size:23px;color:#58a6ff}main{max-width:1400px;margin:auto;padding:30px}button,input,select{font:inherit;color:inherit;background:#21262d;border:1px solid #30363d;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{border-color:#58a6ff}.primary{background:#238636}h2{font-size:19px}small,.muted{color:#8b949e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel,article{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin-bottom:16px}.stats strong{display:block;font-size:32px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-template-columns:repeat(52,12px);gap:4px;overflow:auto;padding:8px 0}.heat span{border-radius:2px}.bar{height:8px;background:#30363d;border-radius:8px;margin:8px 0 15px}.bar i{display:block;background:#58a6ff;height:100%;border-radius:8px}dialog{background:#161b22;color:inherit;border:1px solid #30363d;border-radius:12px;width:min(550px,95vw)}dialog label{display:block;margin:12px 0}dialog input,dialog select{width:100%;margin-top:5px}dialog::backdrop{background:#000a}article h3{margin:0 0 8px}article p{overflow-wrap:anywhere}article button{font-size:12px;margin:3px}.warn{color:#d29922}.ok{color:#3fb950}#timeline{max-height:360px;overflow:auto}.event{padding:10px 0;border-bottom:1px solid #30363d;overflow-wrap:anywhere}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}main{padding:15px}header{flex-wrap:wrap}}</style><header><b>◈ PROJECT PULSE</b><span class=muted>Local development command center</span><button class=primary onclick="dlg.showModal()">+ Add project</button><button onclick="discover()">Discover folders</button></header><main><h1>Workspace overview</h1><div id=stats class=stats></div><section class=panel><h2>Development activity · last 52 weeks</h2><div id=heat class=heat></div><small>Unique changed files per day · click a square to inspect</small><p id=day></p></section><div class=toolbar><h2>Projects</h2><input id=search placeholder="Search projects" oninput=render()><select id=filter onchange=render()><option>All</option><option>Game</option><option>Library</option><option>Application</option></select><button onclick="act('/api/scan')">Rescan all</button></div><div id=projects class=grid></div><div class=grid><section class=panel><h2>Activity ranking · 30 days</h2><div id=ranking></div></section><section class=panel><h2>Recent activity</h2><div id=timeline></div></section></div></main><dialog id=dlg><form id=form><h2>Register project</h2><label>Local absolute folder path<input name=root required placeholder="C:\ProjectX\TKA"></label><label>Project name (optional)<input name=name></label><label>Category<select name=category><option>Game</option><option>Library</option><option>Application</option></select></label><label>Firebase Hosting site ID (optional)<input name=site placeholder="ps-action"></label><label>Remote subdirectory<input name=remotePath placeholder="games/tka"></label><label>Local deployable directory (relative)<input name=output value="."></label><button class=primary>Register</button> <button type=button onclick=dlg.close()>Cancel</button></form></dialog><script>let state={projects:[],events:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?new Date(s).toLocaleString():'Unknown';async function api(url,body){let r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}async function load(){try{state=await api('/api/state');render()}catch(e){console.error(e)}}async function act(url,body={}){try{await api(url,body);await load()}catch(e){alert(e.message)}}async function discover(){let root=prompt('Parent folder absolute path');if(!root)return;try{let dirs=await api('/api/discover',{root});for(let d of dirs)if(!state.projects.some(p=>p.root===d)&&confirm('Register '+d+'?'))await api('/api/add',{root:d});load()}catch(e){alert(e.message)}}$('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/add',Object.fromEntries(new FormData(e.target)));dlg.close();e.target.reset();load()}catch(e){alert(e.message)}};function baseline(id){if(confirm('Only confirm if you independently verified the current local deployable files match this production release. This is a manual assertion, not remote verification.'))act('/api/baseline',{id})}function remove(id){if(confirm('Unregister only? Local files will not be deleted.'))act('/api/remove',{id})}function render(){let p=state.projects,e=state.events,counts=[p.length,p.filter(x=>/outdated|Needs/.test(x.status)).length,p.filter(x=>x.status.startsWith('Up to date')).length,p.filter(x=>Date.now()-Date.parse(x.lastLocal)>30*864e5).length];$('stats').innerHTML=['Projects','Pending / possible','Manual match','Inactive 30d'].map((x,i)=>`<div class=panel><small>${x}</small><strong>${counts[i]}</strong></div>`).join('');$('projects').innerHTML=p.filter(x=>(filter.value==='All'||x.category===filter.value)&&x.name.toLowerCase().includes(search.value.toLowerCase())).map(x=>`<article><small>${esc(x.category)}</small><h3>${esc(x.name)}</h3><b class="${x.status.startsWith('Up')?'ok':'warn'}">${esc(x.status)}</b><p class=muted>${esc(x.root)}</p><p>Local update: ${date(x.lastLocal)}<br>Site release: ${date(x.lastDeploy)}<br>${x.count} files · ${(x.size/1048576||0).toFixed(1)} MB<br>Pending against manual baseline: ${x.pending??'Unknown'}</p><small>${esc(x.error||x.remoteError||'')}</small><div>${x.site?`<button onclick="act('/api/refresh',{id:'${x.id}'})">Refresh Firebase</button><button onclick="baseline('${x.id}')">Confirm baseline</button>`:''}<button onclick="remove('${x.id}')">Unregister</button></div></article>`).join('')||'<p class=muted>No matching projects. Add a local folder to begin.</p>';let days={};for(let a of e){if(!['added','modified','deleted'].includes(a.type))continue;let d=a.time.slice(0,10);(days[d]??=new Set()).add(a.project+'/'+a.file)}$('heat').innerHTML=Array.from({length:364},(_,i)=>{let d=new Date(Date.now()-(363-i)*864e5).toISOString().slice(0,10),n=days[d]?.size||0;return `<span title="${d}: ${n}" style="background:${['#21262d','#0e4429','#006d32','#26a641','#39d353'][n===0?0:n<5?1:n<15?2:n<40?3:4]}" onclick="document.getElementById('day').textContent='${d}: ${n} unique files changed'"></span>`}).join('');let rank=p.map(x=>({name:x.name,n:new Set(e.filter(a=>a.project===x.id&&Date.now()-Date.parse(a.time)<30*864e5&&['added','modified','deleted'].includes(a.type)).map(a=>a.time.slice(0,10)+a.file)).size})).sort((a,b)=>b.n-a.n);$('ranking').innerHTML=rank.map(x=>`${esc(x.name)} · ${x.n}<div class=bar><i style="width:${100*x.n/(rank[0].n||1)}%"></i></div>`).join('');$('timeline').innerHTML=e.slice(-100).reverse().map(a=>`<div class=event><small>${date(a.time)}</small><br><b>${esc(a.name)}</b> · ${esc(a.type)}<br><small>${esc(a.file)}</small></div>`).join('')}load();setInterval(load,5000);</script></html>
